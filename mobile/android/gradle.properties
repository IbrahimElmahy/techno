# `jdk.net.unixdomain.tmpdir` is what makes the build run on this machine at all.
#
# Gradle failed with «Unable to establish loopback connection», which reads like a Gradle or a
# network problem and is neither: a three-line Java program calling `Pipe.open()` fails the same
# way. Java 17 builds its internal pipes on AF_UNIX sockets, and it creates the socket file in
# `jdk.net.unixdomain.tmpdir` — NOT in `java.io.tmpdir`, which is why pointing the usual temp
# variable somewhere else changes nothing. Whatever rejects it under the user profile (the AF_UNIX
# driver itself is running and registered in the Winsock catalog), a directory outside it works.
#
# Harmless everywhere else: on a machine where the default already works, this only moves the
# socket file. `java.io.tmpdir` is set alongside it so Gradle's own scratch files follow.
#
# THIS LINE ALONE IS NOT ENOUGH. It reaches the Gradle DAEMON, and the failure happens earlier, in
# the LAUNCHER that starts before any daemon exists — and the launcher reads only the environment.
# `build_apk.ps1` sets the same flag there; building with a bare `flutter build apk` fails again.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=D:/jtmp -Djava.io.tmpdir=D:/jtmp
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
