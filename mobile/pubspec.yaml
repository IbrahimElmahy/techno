name: techno_inspections
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # بصمة الباسورد للدخول من غير نت. كانت جاية أصلاً مع الحزم التانية.
  crypto: ^3.0.0
  http: ^1.6.0
  # Pinned by flutter_localizations, not by us: the Flutter SDK ships a hard `intl 0.20.2`, so an
  # exact `0.19.0` here made `pub get` unsolvable the moment the SDK moved forward. Only
  # `DateFormat` is used in this app and it is unchanged between the two, so the constraint
  # follows the SDK rather than fighting it.
  intl: ^0.20.2
  path: ^1.9.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.4.2
  sqflite_common_ffi_web: ^1.1.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo.png
