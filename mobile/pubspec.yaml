name: techno_inspections
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  # Pinned by flutter_localizations, not by us: the Flutter SDK ships a hard `intl 0.20.2`, so an
  # exact `0.19.0` here made `pub get` unsolvable the moment the SDK moved forward. Only
  # `DateFormat` is used in this app and it is unchanged between the two, so the constraint
  # follows the SDK rather than fighting it.
  intl: ^0.20.2
  path: ^1.9.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.1
  # عشان التطبيق يفتح على المتصفح للتجربة — المتصفح مالوش بلجن sqflite.
  #
  # الويب بس، من غير حزمة الديسكتوب: دي بتجرّ نسخة sqlite3 أصلية لكل معمارية أندرويد
  # وبتكسر بيلد الـAPK على تحميل ناقص، وإحنا أصلاً مش بنشغّل التطبيق على ويندوز.
  sqflite_common_ffi_web: ^1.1.2
  uuid: ^4.6.0
  # المرفقات: كاميرا ومعرض الصور.
  #
  # file_picker (لأي ملف) اتشال مؤقتاً — بيجرّ حزم androidx بتطلب أدوات بناء أندرويد 8.9.1،
  # والمشروع على 8.6، وترقيتها كانت هتكسر البيلد اللي تعبنا فيه. الصور هي الحالة الغالبة
  # في الميدان على أي حال.
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

# أيقونة التطبيق. اتعملت من اللوجو الحقيقي — assets/images/technotherm_logo.png —
# مش من assets/logo.png، لأن دي طلعت صورة شاشة دخول اتحفظت بالاسم ده بالغلط، وكانت
# هتطلع أيقونة عبارة عن لقطة شاشة مصغّرة.
#
# ملفين: واحد كامل للأيقونة العادية، وواحد اللوجو فيه أصغر للأندرويد التكيّفي —
# النظام بيقص أطراف دي حسب شكل الأيقونة على كل تليفون، فاللي يملا المربع بيتاكل.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
  # الخط. الثيم كان بيطلب Roboto، وهو مالوش عربي حقيقي — الحروف بتتاخد من خط بديل
  # بيختلف من تليفون للتاني، فالتطبيق شكله مختلف على كل جهاز ومحدش يعرف ليه.
  #
  # ملف واحد variable بكل الأوزان، متحمّل جوّه التطبيق مش من الإنترنت لأنه تطبيق
  # ميداني بيشتغل من غير شبكة. نص ترخيص SIL جنبه زي ما الترخيص بيطلب.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
