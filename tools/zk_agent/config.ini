[server]
; Techno server address, as shown in the device token window
url = https://app.technothermeg.com
; one-time device token from: Attendance > Fingerprint devices > Show link token
token = PUT_DEVICE_TOKEN_HERE
verify_tls = true
timeout = 60

[device]
ip = 192.168.1.201
port = 4370
; communication key (Comm Key) set on the device, 0 = none
password = 0
timeout = 10
force_udp = false
; if a TCP connection fails, retry once over UDP
udp_fallback = true
ommit_ping = true
encoding = UTF-8
; disable the keypad only while users/logs are being read, always re-enabled
disable_during_read = true
; K40 log capacity (used when the device does not report it)
log_capacity = 80000

[sync]
; first run sends punches from this date only (YYYY-MM-DD); empty = first day of current month
since_date =
batch_size = 1000
; re-send the last N hours each run so late or out-of-order punches are not missed
overlap_hours = 24
retries = 4
; used only with --loop; the scheduled task interval is set in install_task.bat
interval_minutes = 5
